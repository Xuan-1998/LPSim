<!DOCTYPE html>
<html>
<head>
    <title>LPSim: City-Scale Traffic Visualization</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/deck.gl@latest/dist.min.js"></script>
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow: hidden; }
        #container { width: 100vw; height: 100vh; position: relative; }
        #panel {
            position: absolute; top: 16px; left: 16px; z-index: 10;
            background: rgba(10, 10, 30, 0.92); color: #e0e0e0; padding: 20px;
            border-radius: 12px; max-width: 320px; backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.08);
        }
        #panel h1 { margin: 0 0 4px 0; font-size: 20px; color: #fff; font-weight: 600; }
        #panel .subtitle { color: #90a4ae; font-size: 12px; margin-bottom: 12px; }
        .stat-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .stat-label { color: #78909c; font-size: 12px; }
        .stat-value { color: #4fc3f7; font-size: 13px; font-weight: 500; }
        #legend { margin-top: 14px; }
        .leg-row { display: flex; align-items: center; margin: 4px 0; font-size: 11px; }
        .leg-bar { width: 28px; height: 4px; border-radius: 2px; margin-right: 8px; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
            color: #fff; font-size: 18px; z-index: 100; }
        .github-link { position: absolute; bottom: 16px; right: 16px; z-index: 10;
            background: rgba(10,10,30,0.9); color: #4fc3f7; padding: 8px 14px;
            border-radius: 8px; text-decoration: none; font-size: 12px;
            border: 1px solid rgba(79,195,247,0.3); }
        .github-link:hover { background: rgba(79,195,247,0.15); }
    </style>
</head>
<body>
    <div id="container"></div>
    <div id="loading">Loading SF Bay Area network (50K edges)...</div>
    <div id="panel" style="display:none">
        <h1>LPSim</h1>
        <div class="subtitle">GPU-Accelerated Multi-Modal Traffic Simulator</div>
        <div class="stat-row"><span class="stat-label">Edges (sample)</span><span class="stat-value" id="n-edges">-</span></div>
        <div class="stat-row"><span class="stat-label">Full network</span><span class="stat-value">540,827 edges</span></div>
        <div class="stat-row"><span class="stat-label">Intersections</span><span class="stat-value">223,328</span></div>
        <div class="stat-row"><span class="stat-label">Simulation</span><span class="stat-value">1h → 12s GPU</span></div>
        <div id="legend">
            <div class="leg-row"><div class="leg-bar" style="background:#e53935"></div>Local roads (&lt;25 mph)</div>
            <div class="leg-row"><div class="leg-bar" style="background:#ff9800"></div>Arterials (25-40 mph)</div>
            <div class="leg-row"><div class="leg-bar" style="background:#66bb6a"></div>Major roads (40-55 mph)</div>
            <div class="leg-row"><div class="leg-bar" style="background:#42a5f5"></div>Highways (55+ mph)</div>
        </div>
    </div>
    <a class="github-link" href="https://github.com/Xuan-1998/LPSim">★ GitHub</a>

    <script>
    const {DeckGL, GeoJsonLayer} = deck;

    function speedColor(s) {
        if (s < 25) return [229, 57, 53, 180];
        if (s < 40) return [255, 152, 0, 160];
        if (s < 55) return [102, 187, 106, 160];
        return [66, 165, 245, 200];
    }

    async function init() {
        const resp = await fetch('network.json');
        const data = await resp.json();
        document.getElementById('loading').style.display = 'none';
        document.getElementById('panel').style.display = 'block';
        document.getElementById('n-edges').textContent = data.features.length.toLocaleString();

        let cx = 0, cy = 0, n = 0;
        for (const f of data.features.slice(0, 500)) {
            cx += f.geometry.coordinates[0][0];
            cy += f.geometry.coordinates[0][1];
            n++;
        }

        new DeckGL({
            container: 'container',
            mapStyle: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
            initialViewState: {
                longitude: cx/n, latitude: cy/n,
                zoom: 9.5, pitch: 45, bearing: -15
            },
            controller: true,
            layers: [
                new GeoJsonLayer({
                    id: 'roads',
                    data: data,
                    lineWidthScale: 2,
                    lineWidthMinPixels: 1,
                    getLineColor: f => speedColor(f.properties.s),
                    getLineWidth: f => Math.max(1, f.properties.l * 0.6),
                    pickable: true,
                    autoHighlight: true,
                    highlightColor: [255, 255, 100, 200],
                })
            ],
            getTooltip: ({object}) => object && {
                html: `<b>Edge ${object.properties.id}</b><br>
                       Speed: ${object.properties.s} mph<br>
                       Lanes: ${object.properties.l}<br>
                       Length: ${object.properties.len}m`,
                style: { background: '#1a1a2e', color: '#fff', fontSize: '12px', padding: '8px', borderRadius: '6px' }
            }
        });
    }
    init();
    </script>
</body>
</html>
