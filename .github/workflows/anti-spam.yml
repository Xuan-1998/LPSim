name: Anti-Spam

on:
  issues:
    types: [opened]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check issue author
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const author = issue.user.login;
            
            // Get user info
            const user = await github.rest.users.getByUsername({ username: author });
            const createdAt = new Date(user.data.created_at);
            const now = new Date();
            const ageInDays = (now - createdAt) / (1000 * 60 * 60 * 24);
            
            // Flag: account < 7 days old + empty body or suspicious patterns
            const body = issue.body || '';
            const suspicious = (
              (ageInDays < 7 && body.length < 20) ||
              /telegram|whatsapp|hack|crack|casino|lottery/i.test(body) ||
              (user.data.public_repos === 0 && ageInDays < 30 && body.length < 50)
            );
            
            if (suspicious) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'not_planned'
              });
              await github.rest.issues.lock({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                lock_reason: 'spam'
              });
              console.log(`Closed spam issue #${issue.number} from ${author} (account age: ${ageInDays.toFixed(0)} days)`);
            }
