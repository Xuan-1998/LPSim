name: Feature Request
description: Suggest a new feature or improvement
body:
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this useful for GPU traffic simulation?
    validations:
      required: true
